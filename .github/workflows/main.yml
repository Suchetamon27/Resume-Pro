name: ResumePro Automated AI Poster Pipeline

on:
  push:
    branches: [ main ]      # Runs automatically on every git push
  schedule:
    - cron: '30 3 * * *'    # Runs daily at 09:00 AM IST
  workflow_dispatch:        # Allows manual trigger from GitHub Actions tab

jobs:
  run-ai-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code with History
        uses: actions/checkout@v5
        with:
          fetch-depth: 2    # Fetches previous commit (HEAD~1) for git diff

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Local Web Server
        run: |
          python serve.py &
          sleep 3

      - name: Execute ResumePro AI Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
        run: |
          python git_delta_poster_pipeline.py

      - name: Archive Generated Poster Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resumepro-promotional-poster
          path: output/resumepro_promo_poster.jpg
